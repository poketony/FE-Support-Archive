name: Apply Awakening box art

on:
  push:
    branches: [main]
    paths:
      - '.tmp/awakening-box.b64'
      - '.github/workflows/apply-box-art.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode replacement image
        run: |
          base64 --decode .tmp/awakening-box.b64 > assets/awakening-box.png
          rm -f .tmp/awakening-box.b64 .github/workflows/apply-box-art.yml
          rmdir .tmp 2>/dev/null || true
      - name: Commit replacement image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Awakening box art'
          git push
