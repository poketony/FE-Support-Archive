name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 1

      - name: Check out Korean message source
        uses: actions/checkout@v4
        with:
          repository: poketony/FE-Awakening
          path: source/fe-awakening
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Awakening/Messages (K)/
            /Awakening/DLC Message (K)/22. 인연의 여름.txt
            /Awakening/DLC Message (K)/23. 인연의 비밀 온천.txt
            /Awakening/DLC Message (K)/24. 인연의 수확제.txt
            /Awakening/Awakening-Live-Renderer/assets/awakening/
            /if/파이어 엠블렘 if 대사집 (K)/
            /if/인연의 백야제.txt
            /if/인연의 암야제.txt

      - name: Check out FEITS renderer resources
        uses: actions/checkout@v4
        with:
          repository: SciresM/FEITS
          path: source/feits
          fetch-depth: 1
          sparse-checkout: FEFTS/Resources
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parser and search index
        working-directory: site
        run: node --test test/*.test.mjs

      - name: Build archive data
        run: >-
          node site/scripts/build-data.mjs
          --source source/fe-awakening
          --feits source/feits
          --output site/dist

      - name: Apply Avatar gender data
        run: >-
          node site/scripts/apply-player-gender.mjs
          --source source/fe-awakening
          --root site/dist

      - name: Build game-wide search indexes
        run: |
          node site/scripts/build-search-index.mjs --root site/dist
          node site/scripts/annotate-search-gender.mjs --root site/dist

      - name: Copy search, Avatar, and simulator UI assets
        run: |
          cp site/assets/global-search.js site/dist/assets/global-search.js
          cp site/assets/global-search.css site/dist/assets/global-search.css
          cp site/assets/player-gender.js site/dist/assets/player-gender.js
          cp site/assets/renderer-accelerator.js site/dist/assets/renderer-accelerator.js

      - name: Validate site shell references
        run: node site/scripts/validate-site-shell.mjs --root site/dist

      - name: Validate generated archive
        run: |
          node site/scripts/validate-data.mjs --root site/dist
          node site/scripts/validate-renderer.mjs site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
