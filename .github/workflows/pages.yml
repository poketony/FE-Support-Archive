name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out Korean message source
        uses: actions/checkout@v4
        with:
          repository: poketony/FE-Awakening
          path: source/fe-awakening

      - name: Check out FEITS portrait source
        uses: actions/checkout@v4
        with:
          repository: SciresM/FEITS
          path: source/feits
          sparse-checkout: FEFTS/Resources/img/face
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parser
        working-directory: site
        run: node test/parser.test.mjs

      - name: Build archive data
        run: >-
          node site/scripts/build-data.mjs
          --source source/fe-awakening
          --feits source/feits
          --output site/dist

      - name: Validate generated archive
        run: node site/scripts/validate-data.mjs --root site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
