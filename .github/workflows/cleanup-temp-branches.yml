name: Cleanup temporary branches

on:
  push:
    paths:
      - '.github/workflows/cleanup-temp-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Delete temporary branches
        run: |
          for branch in tmp-image-replace tmp-noop tmp-noop2 cleanup-temp-helper noop; do
            git push origin --delete "$branch" || true
          done
